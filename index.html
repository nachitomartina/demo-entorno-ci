<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card-img-top {
            height: 350px; /* Le di un poquito más de altura para que se luzcan las portadas */
            object-fit: contain; /* Muestra TODA la foto sin cortar absolutamente nada */
            background-color: #e9ecef; /* Un fondo gris muy clarito para rellenar los huecos vacíos */
            padding: 15px; /* Un margen interno para que la foto no toque los bordes */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">GamerZone CI/CD</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Ofertas</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Buscar videojuegos..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h1 class="display-4 fw-bold">Welcome a GamerZone</h1>
        <p class="lead">Los mejores títulos clásicos al alcance de tu mano</p>
    </div>

    <div class="container mt-5 mb-5">
        <div class="row text-center">
            
            <div class="col-md-3 col-sm-12 mb-4">
                <div class="card shadow-sm h-100">
                    <img src="re4.jpeg" class="card-img-top" alt="Resident Evil 4">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title">Resident Evil 4 (2005)</h5>
                        <div>
                            <p class="card-text fs-4 text-success fw-bold">$ 12.000</p>
                            <a href="#" class="btn btn-primary w-50">Comprar</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-12 mb-4">
                <div class="card shadow-sm h-100">
                    <img src="minecraft.webp" class="card-img-top" alt="Minecraft">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title">Minecraft</h5>
                        <div>
                            <p class="card-text fs-4 text-success fw-bold">$ 9.600</p>
                            <a href="#" class="btn btn-primary w-50">Comprar</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-12 mb-4">
                <div class="card shadow-sm h-100">
                    <img src="fifa14.jpeg" class="card-img-top" alt="FIFA 14">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title">FIFA 14</h5>
                        <div>
                            <p class="card-text fs-4 text-success fw-bold">$ 6.800</p>
                            <a href="#" class="btn btn-primary w-50">Comprar</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-12 mb-4">
                <div class="card shadow-sm h-100">
                    <img src="wii-sports-resort.jpeg" class="card-img-top" alt="Wii Sports Resort">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title">Wii Sports Resort</h5>
                        <div>
                            <p class="card-text fs-4 text-success fw-bold">$ 8.000</p>
                            <a href="#" class="btn btn-primary w-50">Comprar</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
