name: Entorno de Integracion Continua

# ¿Cuándo se va a ejecutar esto? Cuando hagamos un 'push' a la rama 'main'
on:
  push:
    branches: [ "main" ]

# ¿Qué trabajos (jobs) va a realizar el servidor?
jobs:

  # =========================================================
  # NODO 1: CONTROL DE CALIDAD Y AUDITORÍA
  # =========================================================
  control-de-calidad:
    runs-on: ubuntu-latest
    steps:
    # 1. Copiar nuestro código del repositorio a la máquina virtual
    - name: Obtener el código
      uses: actions/checkout@v4

    # 2. Instalar Node.js en la máquina virtual
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 3. Instalar las dependencias
    - name: Instalar dependencias
      run: npm install

    # 4. Ejecutar las pruebas automáticas
    - name: Ejecutar pruebas SDD
      run: npm test

    # 5. Construir la imagen de Docker
    - name: Construir Imagen Docker (El Binario)
      run: docker build -t api-ci .

    # 6. Revisión de código con SonarCloud
    - name: Escaneo de SonarCloud
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 7. Correo de Alerta (Se queda en el Nodo 1 para reaccionar rápido al fallo)
    - name: Enviar correo de error
      if: failure() 
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "❌ GamerZone: Fallo en la tubería CI/CD"
        body: |
          ¡Alerta! El código nuevo rompió las pruebas de negocio y el despliegue fue cancelado.
          
          Para ver el motivo exacto del fallo, hacé clic en este enlace para abrir los registros del servidor:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ignacioamartina@gmail.com 
        from: "GamerZone Bot"


  # =========================================================
  # NODO 2: DESPLIEGUE Y FEEDBACK POSITIVO
  # =========================================================
  despliegue-produccion:
    runs-on: ubuntu-latest
    needs: control-de-calidad # ESTA ES LA FLECHA QUE UNE LOS NODOS
    
    steps:
    # 8. Gatillo de despliegue en Render
    - name: Disparar actualización en Render
      run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"

    # 9. Correo de Éxito
    - name: Enviar correo de éxito
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "✅ GamerZone: Despliegue Exitoso"
        body: "¡Hola! Las pruebas automáticas del carrito y los descuentos pasaron perfectamente. La nueva versión de GamerZone se empaquetó con éxito."
        to: ignacioamartina@gmail.com 
        from: "GamerZone Bot"