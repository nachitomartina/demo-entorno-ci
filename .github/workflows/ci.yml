name: Entorno de Integracion Continua

# ¿Cuándo se va a ejecutar esto? Cuando hagamos un 'push' a la rama 'main'
on:
  push:
    branches: [ "main" ]

# ¿Qué trabajos (jobs) va a realizar el servidor?
jobs:
  build-y-test:
    # La computadora virtual que nos presta GitHub
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar nuestro código del repositorio a la máquina virtual
    - name: Obtener el código
      uses: actions/checkout@v4

    # 2. Instalar Node.js en la máquina virtual
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 3. Instalar las dependencias (Express, Cucumber, etc.)
    - name: Instalar dependencias
      run: npm install

    # 4. Ejecutar las pruebas automáticas
    - name: Ejecutar pruebas SDD
      run: npm test

    # --- NUEVO PASO AGREGADO ---
    - name: Construir Imagen Docker (El Binario)
      run: docker build -t api-ci .

    - name: Escaneo de SonarCloud
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}